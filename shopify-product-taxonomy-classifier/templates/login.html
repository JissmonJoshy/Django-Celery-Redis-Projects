<br><br><br><br>
<section class="contact section-padding">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-lg-5">

                <div class="form-box">

                    <h5 class="mb-4 text-center">Login</h5>

                    {% if messages %}
                        {% for i in messages %}
                            <div class="alert alert-danger">
                                {{ i }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">

                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-12 form-group">
                                <input type="text"
                                       name="username"
                                       placeholder="Username"
                                       required>
                            </div>

                            <div class="col-md-12 form-group">
                                <input type="password"
                                       name="password"
                                       placeholder="Password"
                                       required>
                            </div>

                            <div class="col-md-12">
                                <input type="submit" value="Login">
                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>
</section>

{% endblock %}
