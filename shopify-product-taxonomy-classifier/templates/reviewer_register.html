{% extends "common.html" %}
{% load static %}

{% block content %}

<br><br><br><br>

<section class="contact section-padding">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="form-box">

                    <h5 class="mb-4 text-center">Reviewer Registration</h5>

                    {% if messages %}
                        {% for i in messages %}
                            <div class="alert alert-danger">
                                {{ i }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="row">

                            <!-- Name -->
                            <div class="col-md-12 form-group">
                                <input type="text"
                                       name="name"
                                       placeholder="Full Name"
                                       required>
                            </div>

                            <!-- Address -->
                            <div class="col-md-12 form-group">
                                <textarea name="address"
                                          placeholder="Address"
                                          rows="4"
                                          required></textarea>
                            </div>

                            <!-- Email -->
                            <div class="col-md-12 form-group">
                                <input type="email"
                                       name="email"
                                       placeholder="Email"
                                       required>
                            </div>

                            <!-- Phone -->
                            <div class="col-md-12 form-group">
                                <input type="text"
                                       name="phone"
                                       placeholder="Phone Number"
                                       maxlength="10"
                                       required>
                            </div>

                            <!-- Username -->
                            <div class="col-md-12 form-group">
                                <input type="text"
                                       name="username"
                                       placeholder="Username"
                                       required>
                            </div>

                            <!-- Password -->
                            <div class="col-md-12 form-group">
                                <input type="password"
                                       name="password"
                                       placeholder="Password"
                                       required>
                            </div>

                            <!-- Confirm Password -->
                            <div class="col-md-12 form-group">
                                <input type="password"
                                       name="confirm_password"
                                       placeholder="Confirm Password"
                                       required>
                            </div>

                            <!-- Image -->
                            <div class="col-md-12 form-group">
                                <label>Profile Image</label>
                                <input type="file"
                                       name="image"
                                       accept="image/*"
                                       required>
                            </div>

                            <!-- Submit -->
                            <div class="col-md-12">
                                <input type="submit"
                                       value="Register">
                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>
</section>

{% endblock %}
